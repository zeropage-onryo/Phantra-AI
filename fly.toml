# fly.toml app configuration file generated for zeropage-studio on 2026-09-04T11:38:19-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'zeropage-studio'
primary_region = 'iad'
# How long a deploy waits for the old process after SIGINT before SIGKILL.
# Fly's default is 5s, and uvicorn's graceful shutdown (ops/fly/
# supervisord.conf) is 3s plus supervisord's own teardown -- too close.
# A process SIGKILLed here is reported by Fly's init as "Process appears
# to have been OOM killed!", which is what the 16:18 "OOM" on 2026-09-30
# was: no workload, no memory growth, one open /api/jobs/stream.
kill_timeout = '15s'

[build]
[env]
  PORT = '8000'
  # the React Director lives in the studio on phantra.ai (Vercel);
  # /ui hands a planned concept over to it. It named zeropage-web.fly.dev
  # until 2026-10-11, an app scaled to zero since the studio moved to Vercel.
  DIRECTOR_FRONTEND_URL = 'https://phantra.ai/studio/flows'
  # The MCP surface's canonical URI (RFC 8707), which the OAuth
  # protected-resource document publishes. Set explicitly rather than
  # derived from SITE_URL, which is unset here on purpose: SITE_URL also
  # drives the landing page's canonical tags and sitemap, and the public
  # site is the Vercel app, not this origin.
  # 2026-10-11: the studio's own domain, not fly.dev -- both directories
  # expect the connector's domain to match the service. The Claude
  # listing is the same resource + '/claude'. A connector added by hand
  # at the fly.dev address must be removed and re-added at this one.
  ZEROPAGE_MCP_RESOURCE = 'https://api.phantra.ai/mcp'

[[mounts]]
  source = 'zeropage_data'
  destination = '/app/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
